# ================================================================
# pages.yml
# ----------------------------------------------------------------
# PURPOSE : Build the admin web page (web/) and publish it to GitHub Pages:
#           https://mirageaecindia-dev.github.io/Mirage-Tracker-Reminder/
#
# ONE-TIME SETUP: repo -> Settings -> Pages -> Build and deployment ->
#           Source = "GitHub Actions".
#
# CHANGE LOG
# - 2026-10-14 : Initial version.
#     * Runs on pushes that touch the page or the shared logic it imports
#       (web/, core/, assets/), plus a manual "Run workflow" button.
#     * npm ci in web/ = exact versions from web/package-lock.json (created
#       by "npm install" in web/ on the PC and committed).
#     * No secrets: the page has none by design (see web/src/authConfig.js).
#     * permissions pages/id-token: required by the official deploy action.
# ================================================================

name: Publish admin page

on:
  push:
    branches: [main]
    paths: ["web/**", "core/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
